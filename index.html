  (async function(){
    function b64ToBuf(b64){
      if (!b64) return new ArrayBuffer(0);
      b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    function getFragmentKey(){
      const h = location.hash ? location.hash.slice(1) : '';
      return decodeURIComponent(h);
    }

    async function decryptWithRawKey(base64Key, payload){
      const keyBuf = b64ToBuf(base64Key);
      if (keyBuf.byteLength !== 16) throw new Error('Key must decode to 16 bytes (AES-128).');
      const ivBuf = b64ToBuf(payload.iv);
      const ctBuf = b64ToBuf(payload.ciphertext);
      const cryptoKey = await crypto.subtle.importKey(
        "raw",
        keyBuf,
        { name: "AES-GCM" },
        false,
        ["decrypt"]
      );
      const plainBuf = await crypto.subtle.decrypt({name: "AES-GCM", iv: new Uint8Array(ivBuf)}, cryptoKey, ctBuf);
      const dec = new TextDecoder();
      return dec.decode(plainBuf);
    }

    const payload = JSON.parse(atob(PAYLOAD_B64));

    const fragKey = getFragmentKey();
    if (fragKey) {
      try {
        const plaintext = await decryptWithRawKey(fragKey, payload);
        document.open();
        document.write(plaintext);
        document.close();
        return;
      } catch(e) {
        console.error("Auto decryption failed:", e);
      }
    }
  })();
